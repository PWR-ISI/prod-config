# LocalStack: Emulates all AWS services (Cognito, RDS, DynamoDB, S3, SNS, SQS, ECS, ECR, etc.)
# Applications connect to LocalStack endpoint: http://localhost:4566
#
# Used by scripts/run-all.ps1: the full ECS/Fargate model (needs ecr, ecs, rds, elbv2,
# apigatewayv2, ec2/VPC) and Docker-in-Docker (docker.sock) so LocalStack can spawn
# ECS task + RDS containers on the host Docker engine.
services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: prod-localstack
    ports:
      - "127.0.0.1:4566:4566"          # All AWS services on single edge port
      - "127.0.0.1:4510-4559:4510-4559" # Port range for emulated RDS / other services
    environment:
      - LOCALSTACK_DOCKER_NAME=prod-localstack
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      # Full service set required by the Terraform/ECS deployment.
      - SERVICES=apigateway,apigatewayv2,sqs,sns,s3,cognito-idp,iam,sts,logs,secretsmanager,ecr,ecs,rds,dynamodb,lambda,cloudwatch,kms,ec2,elbv2,autoscaling,application-autoscaling
      - DEBUG=${DEBUG:-0}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - PERSISTENCE=1
      # Let LocalStack launch ECS task / RDS containers on the host Docker engine.
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "./localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
