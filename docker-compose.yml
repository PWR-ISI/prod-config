# LocalStack: Emulates all AWS services (Cognito, RDS, DynamoDB, S3, SNS, SQS, etc.)
# Applications connect to LocalStack endpoint: http://localhost:4566
#
# To use:
# 1. Start LocalStack: docker-compose up -d
# 2. Run applications locally or in separate containers
# 3. All AWS service calls go through LocalStack on port 4566

services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: prod-localstack
    ports:
      - "127.0.0.1:4566:4566"        # All AWS services on single port
    environment:
      - LOCALSTACK_DOCKER_NAME=prod-localstack
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - SERVICES=sqs,sns,s3,cognito-idp,iam,sts,logs,secretsmanager,dynamodb,cloudwatch
      - DEBUG=${DEBUG:-0}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "./localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
